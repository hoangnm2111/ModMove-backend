name: Backend CI Pipeline (.NET 8)

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build-lint-test:
    name: Build, Lint & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: đŸ“¥ Checkout Code
        uses: actions/checkout@v4

      - name: â™ï¸ Setup .NET 8.0 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: đŸ“¦ Cache NuGet Packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.sln') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: đŸ”„ Restore NuGet Dependencies
        run: |
          if ls *.sln 1> /dev/null 2>&1 || ls */*.csproj 1> /dev/null 2>&1 || ls src/*/*.csproj 1> /dev/null 2>&1; then
            dotnet restore
          else
            echo "â„¹ï¸ No solution or project files detected yet. Skipping restore."
          fi

      - name: đŸ” Code Format & Style Check
        run: |
          if ls *.sln 1> /dev/null 2>&1; then
            dotnet format --verify-no-changes --verbosity normal || echo "::warning::Coding style inconsistencies detected."
          else
            echo "â„¹ï¸ Solution file not yet committed. Skipping format verification."
          fi

      - name: đŸ”¨ Compile & Build (Release)
        run: |
          if ls *.sln 1> /dev/null 2>&1 || ls */*.csproj 1> /dev/null 2>&1 || ls src/*/*.csproj 1> /dev/null 2>&1; then
            dotnet build --no-restore --configuration Release
          else
            echo "â„¹ï¸ No projects to build yet. Skipping build step."
          fi

      - name: đŸ§ª Execute Unit Tests
        run: |
          if [ -d tests ] && [ "\" ]; then
            dotnet test --no-build --configuration Release --verbosity normal --collect:"XPlat Code Coverage"
          else
            echo "â„¹ï¸ No tests directory committed yet. Skipping test execution."
          fi