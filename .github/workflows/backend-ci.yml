name: Backend CI Pipeline (.NET 8)

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch: {}

env:
  SOLUTION: ModMove.slnx

jobs:
  build-lint-test:
    name: Build, Lint & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Projects target net8.0; SDK 9.0.200+ is required to read the .slnx solution format.
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore NuGet Dependencies
        run: dotnet restore $SOLUTION

      - name: Code Format & Lint Check
        run: dotnet format $SOLUTION --verify-no-changes --no-restore --verbosity normal || echo "::warning::Code format check warning."

      - name: Compile & Build
        run: dotnet build $SOLUTION --no-restore --configuration Release

      - name: Execute Tests
        run: dotnet test $SOLUTION --no-build --configuration Release --verbosity normal --collect:"XPlat Code Coverage"
